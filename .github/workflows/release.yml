name: release

# Builds the Windows release binary and, on a version tag, attaches it to a GitHub
# Release. Triggered by pushing a tag like v0.1.2, or manually via workflow_dispatch
# (which builds and uploads a workflow artifact but does not publish a release, since
# there is no tag to attach it to).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        shell: pwsh
        env:
          # The opus crate vendors libopus and builds it via cmake, and libopus's
          # CMakeLists.txt still declares cmake_minimum_required(VERSION 3.1), which
          # CMake 4 (what windows-latest ships) refuses outright:
          # "Compatibility with CMake < 3.5 has been removed from CMake." This is
          # CMake's own documented escape hatch — configure the project as if it had
          # declared at least this policy version, instead of erroring. See
          # docs/TESTING.md and README.md for the full story; this was verified by
          # hand on a real Windows machine before being trusted to CI.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cargo build --release --locked
          cargo test --release --locked

      - name: Stage asset
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $name = "ConfluenceVoice-$ver-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force "$dir/contrib", "$dir/docs" | Out-Null
          Copy-Item target/release/confluencevoice.exe $dir
          Copy-Item README.md, LICENSE, NOTICE $dir
          Copy-Item contrib/confluencevoice.ini "$dir/contrib"
          Copy-Item docs/*.md "$dir/docs"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
          "ASSET_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
